name: Build & Release SpendWise APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Generate and Validate Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Android App Bundle (.aab) for Google Play
      run: ./gradlew bundleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.0-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.0-AAB
        path: app/build/outputs/bundle/debug/*.aab

    - name: Create / Update GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.0.0
        name: "SpendWise v2.0.0 Release"
        body: |
          ### SpendWise v2.0.0 Release 🚀

          #### ✨ Features & Improvements:
          - 🧭 **Hybrid Navigation**: 4-Tab Bottom Navigation Bar (Home, Analytics, Budgets, Accounts) + Utility Drawer.
          - 💳 **Multi-Account & Transfers**: Support for Cash, Bank, Credit Card, Savings with real-time dynamic balance updates.
          - 🔄 **Recurring Transactions Engine**: Scheduled daily, weekly, monthly, and yearly transactions.
          - 🏷️ **Tagging System**: Custom color-coded labels and multi-tag filtering.
          - 📅 **Date Range Filters**: All Time, This Month, Last Month, Last 3 Months, This Year, and Custom DateRangePicker.
          - 👁️ **Privacy Mode**: Balance obfuscation toggle (••••••) on SummaryCard.
          - 🗑️ **Swipe-to-Delete**: Quick swipe with instant Undo snackbar.
          - 🐞 **Timezone & Database Bug Fixes**: Fixed UTC datepicker shift and Room database callback race conditions.
        files: |
          app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
