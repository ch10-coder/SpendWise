name: Build & Release SpendWise APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f app/spendwise.keystore ]; then
          echo "Generating permanent SpendWise keystore..."
          keytool -genkeypair -v \
            -keystore app/spendwise.keystore \
            -alias spendwisekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendwisepassword \
            -keypass spendwisepassword \
            -dname "CN=SpendWise, OU=Mobile, O=SpendWise, L=Global, ST=Global, C=US"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/spendwise.keystore
          git commit -m "ci: commit permanent spendwise.keystore for persistent signature updates [skip ci]" || true
          git push origin main || true
        else
          echo "Permanent keystore already exists. Using existing signature certificate."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Generate and Validate Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug and Release APKs
      run: ./gradlew assembleRelease assembleDebug --stacktrace

    - name: Build Android App Bundle (.aab) for Google Play
      run: ./gradlew bundleRelease bundleDebug --stacktrace

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.4.0-APKs
        path: app/build/outputs/apk/**/*.apk

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.4.0-AAB
        path: app/build/outputs/bundle/**/*.aab

    - name: Create / Update GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.4.0
        name: "SpendWise v2.4.0 Bharat Edition 🇮🇳 (120 FPS Fast • Light & Dark)"
        body: |
          ### SpendWise v2.4.0 Bharat Edition 🇮🇳 (Made with ❤️ in India)

          #### ⚡ Performance & Polish:
          - 🚀 **120 FPS Buttery Smooth Scrolling**: Eradicated main-thread blocking (`runBlocking` startup freeze eliminated with 0ms memory cache). Pre-aggregated daily totals in ViewModel on `Dispatchers.Default`.
          - 🧹 **Zero GC Stutter**: Replaced per-frame gradient shader allocations in `LazyColumn` with static hardware-accelerated borders.
          - 🇮🇳 **Indian Numbering (Lakhs & Crores)**: High-speed zero-allocation Indian currency formatter (`₹1,48,500.50`).
          - 🌓 **Strictly Light & Dark Modes**: Removed 7 bloated color palettes; streamlined to Midnight Indigo Dark and Optical Paper Light.
          - 💳 **Indian Financial Context**: UPI payment accounts (GPay, PhonePe, Paytm), Indian lifestyle categories (Kirana, Chai & Snacks, Auto/Metro, Fastag, SIP / Mutual Funds, Pooja/Festivals).
          - 🔒 **Biometric App Lock & 100% Offline**: Private local SQLite database, zero tracking, zero cloud dependency.
        files: |
          app/build/outputs/apk/**/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
