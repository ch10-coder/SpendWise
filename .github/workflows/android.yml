name: Build & Release SpendWise APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f app/spendwise.keystore ]; then
          echo "Generating permanent SpendWise keystore..."
          keytool -genkeypair -v \
            -keystore app/spendwise.keystore \
            -alias spendwisekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendwisepassword \
            -keypass spendwisepassword \
            -dname "CN=SpendWise, OU=Mobile, O=SpendWise, L=Global, ST=Global, C=US"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/spendwise.keystore
          git commit -m "ci: commit permanent spendwise.keystore for persistent signature updates [skip ci]" || true
          git push origin main || true
        else
          echo "Permanent keystore already exists. Using existing signature certificate."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Generate and Validate Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Android App Bundle (.aab) for Google Play
      run: ./gradlew bundleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.1.0-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.1.0-AAB
        path: app/build/outputs/bundle/debug/*.aab

    - name: Create / Update GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.1.0
        name: "SpendWise v2.1.0 Release"
        body: |
          ### SpendWise v2.1.0 Release 🎯

          #### ✨ What's New in v2.1.0:
          - 🎯 **Savings Goals Management**: Set financial targets with animated progress tracking.
          - 💰 **Deposit & Withdraw Flows**: Direct one-tap savings deposits and withdrawals.
          - 📅 **Target Date Timeline**: Deadline tracking with dynamic remaining-days countdown.
          - 🧭 **Quick Drawer Access**: Easily access Savings Goals right from the navigation drawer.
          - 🔑 **Permanent Cryptographic Signature**: Every future APK update now shares the exact same persistent keystore certificate for seamless in-place updates.
        files: |
          app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
