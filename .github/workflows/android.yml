name: Build & Release SpendWise APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f app/spendwise.keystore ]; then
          echo "Generating permanent SpendWise keystore..."
          keytool -genkeypair -v \
            -keystore app/spendwise.keystore \
            -alias spendwisekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendwisepassword \
            -keypass spendwisepassword \
            -dname "CN=SpendWise, OU=Mobile, O=SpendWise, L=Global, ST=Global, C=US"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/spendwise.keystore
          git commit -m "ci: commit permanent spendwise.keystore for persistent signature updates [skip ci]" || true
          git push origin main || true
        else
          echo "Permanent keystore already exists. Using existing signature certificate."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Generate and Validate Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug and Release APKs
      run: ./gradlew assembleRelease assembleDebug --stacktrace

    - name: Build Android App Bundle (.aab) for Google Play
      run: ./gradlew bundleRelease bundleDebug --stacktrace

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.5.0-APKs
        path: app/build/outputs/apk/**/*.apk

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-v2.5.0-AAB
        path: app/build/outputs/bundle/**/*.aab

    - name: Create / Update GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.5.0
        name: "SpendWise v2.5.0 Bharat Edition 🇮🇳 (Accounts, Transfers & Real App Lock)"
        body: |
          ### SpendWise v2.5.0 Bharat Edition 🇮🇳 (Made with ❤️ in India)

          #### ✨ New & Improved
          - 💳 **Accounts that work**: pick the account on every transaction, set opening balances, edit accounts, choose a default, see your total net worth.
          - 🔁 **Transfers**: move money between your own accounts (e.g. Bank → Cash) without it counting as spending.
          - 🏷️ **Tags** can now be added to transactions, and editing a transaction keeps them.
          - 🔒 **Biometric App Lock** now really locks the app (fingerprint, face or screen lock) and re-locks after 30 seconds in the background.
          - 🎨 **Fresh look**: new gradient balance card with savings insight and one-tap Expense / Income / Transfer, sticky date headers, consistent dialogs and pickers.

          #### 🛡️ Safety & Fixes
          - Every delete (accounts, categories, tags, budgets, goals, recurring rules) now asks first; deleted transactions come back exactly with Undo.
          - Recurring rules no longer duplicate past entries after an edit, keep month-end dates (31st stays the 31st) and skip paused periods.
          - CSV: notes with line breaks, ₹/Hindi text in Excel, account names, Indian date formats, and no duplicates when re-importing.
          - Local API now listens only on the phone itself (127.0.0.1) and blocks websites from reaching it.
          - Analytics and day totals no longer count transfers as expenses; custom date ranges include the full last day.
        files: |
          app/build/outputs/apk/**/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
