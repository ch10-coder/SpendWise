name: Build Check

# Compiles every branch other than main before it is merged, so a broken build never reaches
# the release workflow. The debug APK is attached to the run for testing on a phone.
on:
  push:
    branches-ignore: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug and Release APKs
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SpendWise-debug-apk
        path: app/build/outputs/apk/debug/*.apk
